name: collector

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: collector

  image:
    # Only publish from main; pull requests get the lint check alone.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./collector
          # The DXP4800 Plus is a Pentium Gold 8505, so amd64 only.
          platforms: linux/amd64
          push: true
          tags: |
            pimvanleeuwen/home-kiosk-collector:latest
            pimvanleeuwen/home-kiosk-collector:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Context is the repo root: the image needs both dashboard/ and the
      # Caddyfile, which live in different directories.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dashboard/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            pimvanleeuwen/home-kiosk-dashboard:latest
            pimvanleeuwen/home-kiosk-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
