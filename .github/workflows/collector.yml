name: collector

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          src: collector

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Same runtime as the image (python:3.14-slim).
          python-version: '3.14'
          cache: pip
          cache-dependency-path: collector/pyproject.toml

      - run: pip install -e '.[dev]'
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  e2e:
    # Builds the dashboard image itself (see e2e/playwright.config.ts).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

  image:
    # Only publish from main; pull requests get the checks alone.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint, test, web, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./collector
          # The DXP4800 Plus is a Pentium Gold 8505, so amd64 only.
          platforms: linux/amd64
          push: true
          tags: |
            pimvanleeuwen/home-kiosk-collector:latest
            pimvanleeuwen/home-kiosk-collector:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Context is the repo root: the image builds web/ and also needs
      # dashboard/ and the Caddyfile, which live in different directories.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dashboard/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            pimvanleeuwen/home-kiosk-dashboard:latest
            pimvanleeuwen/home-kiosk-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
