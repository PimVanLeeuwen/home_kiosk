name: collector

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          src: collector

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Same runtime as the image (python:3.14-slim).
          python-version: '3.14'
          cache: pip
          cache-dependency-path: collector/pyproject.toml

      - run: pip install -e '.[dev]'
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  e2e:
    # Builds the dashboard image itself (see e2e/playwright.config.ts).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

  panels:
    # The desk panels' firmware (panels/firmware), for every board: no Wi-Fi
    # details in it, as it ships in the public dashboard image (each board keeps
    # its network from its first USB flash). Its version is git's hash of the
    # firmware folder, so the boards only update when the firmware changed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        env:
          # The hub address the boards ask, kept out of the repo. Pull requests from
          # forks get no secrets and build with the example address (they never
          # ship); anything that can ship fails without it.
          PANEL_HUB_URL: ${{ secrets.PANEL_HUB_URL }}
        run: |
          if [ -n "$PANEL_HUB_URL" ]; then
            printf 'CONFIG_PANEL_HUB_URL="%s"\n' "$PANEL_HUB_URL" > panels/firmware/sdkconfig.secrets
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::No PANEL_HUB_URL secret: built with the example hub address"
          else
            echo "::error::Set the PANEL_HUB_URL secret (docs/operations.md, Desk panels)"; exit 1
          fi
          version=$(git rev-parse --short HEAD:panels/firmware)
          docker run --rm -e PANEL_VERSION="$version" -v "$PWD/panels/firmware":/project -w /project \
            espressif/idf:v5.5.6 idf.py build
          mkdir -p panels/dist
          cp panels/firmware/build/desk_panel.bin panels/dist/firmware.bin
          size=$(stat -c %s panels/dist/firmware.bin)
          printf '{"version": "%s", "size": %s}\n' "$version" "$size" > panels/dist/firmware.json
          cat panels/dist/firmware.json

      - uses: actions/upload-artifact@v7
        with:
          name: panel-firmware
          path: |
            panels/dist/firmware.bin
            panels/dist/firmware.json
          retention-days: 7

  image:
    # Only publish from main; pull requests get the checks alone.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint, test, web, e2e, panels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./collector
          # The DXP4800 Plus is a Pentium Gold 8505, so amd64 only.
          platforms: linux/amd64
          push: true
          tags: |
            pimvanleeuwen/home-kiosk-collector:latest
            pimvanleeuwen/home-kiosk-collector:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/download-artifact@v8
        with:
          name: panel-firmware
          path: panels/dist

      # Context is the repo root: the image builds web/ and also needs
      # dashboard/ and the Caddyfile, which live in different directories.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dashboard/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            pimvanleeuwen/home-kiosk-dashboard:latest
            pimvanleeuwen/home-kiosk-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
