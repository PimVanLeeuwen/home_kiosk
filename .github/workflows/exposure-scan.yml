name: exposure-scan

# Nightly port scan of the home IP from outside the house (plan.md M14). The
# runner joins the tailnet as a temporary node tagged tag:exposure-scan, which
# the tailnet policy only lets reach the hub's API. It asks the hub for the
# current home IP (it changes now and then), scans every TCP port over the
# normal internet, and posts the result back to the hub, which alerts on any
# open port and on a missing scan. Setup: README, "Port scan from outside".

on:
  schedule:
    - cron: '30 3 * * *'  # UTC; after the NAS's night jobs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:exposure-scan

      - name: Scan the home IP and report to the hub
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          NOTIFY_KEY: ${{ secrets.NOTIFY_KEY }}
        run: |
          set -u
          scan=.github/scripts/port_scan.py
          if curl -fsS --max-time 30 -H "X-Notify-Key: $NOTIFY_KEY" -o target.json "$HUB_URL/api/exposure/target" \
              && ip=$(python3 -c 'import json; print(json.load(open("target.json"))["ip"])'); then
            # Keep the home IP out of the log.
            echo "::add-mask::$ip"
            python3 "$scan" "$ip" > result.json || python3 "$scan" --error "The scan itself failed" > result.json
          else
            python3 "$scan" --error "Could not get the home IP from the hub" > result.json
          fi
          curl -fsS --max-time 30 -X POST -H "Content-Type: application/json" -H "X-Notify-Key: $NOTIFY_KEY" \
            --data @result.json "$HUB_URL/api/exposure/scan" > /dev/null
