## The versions Waveshare builds its examples with (2026-08), pinned.
dependencies:
  idf: ">=5.5,<5.6"
  waveshare/esp32_p4_wifi6_touch_lcd_4b:
    version: "3.0.1"
  espressif/esp_lvgl_adapter:
    version: "0.6.3"
    # A patched copy (components/esp_lvgl_adapter/README.md): a stack overflow on many dirty areas.
    override_path: "../components/esp_lvgl_adapter"
  lvgl/lvgl:
    version: "9.3.0"
    public: true
  espressif/esp_hosted: "2.12.11"
  espressif/esp_wifi_remote: "1.6.3"
