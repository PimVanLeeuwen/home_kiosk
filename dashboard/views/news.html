<section class="view" data-view="news">

  <div class="view-head">
    <div class="host">
      <span class="dot-accent"></span>
      <span class="mono">Headlines</span>
    </div>
    <div class="mono" data-f="clock"></div>
  </div>

    <div class="foot-status" data-f="pulled"></div>
  </div>

</section>
