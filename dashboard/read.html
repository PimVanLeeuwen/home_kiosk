<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Headlines</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  /* This page is the opposite of the kiosk: a scrolling, reflowing document
     rather than a fixed 720x1280 board. It shares the tokens and fonts, but
     none of the board layout. */
  html, body {
    width: auto;
    height: auto;
    min-height: 100%;
    overflow: auto;
    position: static;
    -webkit-text-size-adjust: 100%;
  }

  body {
    padding: max(20px, env(safe-area-inset-top)) 20px
             max(28px, env(safe-area-inset-bottom));
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 18px;
  }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .pulled { font-family: var(--font-mono); font-size: 11px;
            letter-spacing: 0.1em; color: var(--text-muted); }
  .pulled.is-stale { color: var(--amber); }

  /* Jump links — with 120 headlines, scrolling to a topic matters. */
  nav { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 20px; }
  nav a {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; text-decoration: none;
    color: var(--text-2); background: var(--chip);
    padding: 8px 12px; border-radius: var(--radius-pill);
  }

  section { margin-bottom: 34px; scroll-margin-top: 12px; }
  .group-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 6px; margin-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .group-title { font-size: 19px; font-weight: 600; }
  .group-count { font-family: var(--font-mono); font-size: 11px;
                 letter-spacing: 0.1em; color: var(--text-muted); }

  .row { display: flex; align-items: flex-start; gap: 10px;
         border-bottom: 1px solid var(--hairline); }
  .row:last-child { border-bottom: none; }

  /* The headline is the link. Generous vertical padding: this is a thumb
     target, not a mouse target. */
  .row a.title {
    flex: 1; display: block; text-decoration: none; color: var(--text);
    font-size: 17px; line-height: 1.4; padding: 14px 0;
  }
  .row a.title:active { color: var(--accent); }
  .meta { margin-top: 6px; display: flex; align-items: center; gap: 8px; }
  .source { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
            background: var(--chip); border-radius: 5px; padding: 3px 6px;
            color: var(--text-2); }
  .age { font-size: 12px; color: var(--text-muted); }

  /* Save-to-Readeck, deliberately separate from the headline link so a tap
     to read never saves by accident. */
  .save {
    flex: none; align-self: center; width: 44px; height: 44px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: none; color: var(--text-muted); font-size: 17px;
    cursor: pointer; transition: background-color 140ms ease, color 140ms ease;
  }
  .save:active { background: var(--chip); }
  .save.is-saved { color: var(--accent); border-color: var(--accent);
                   background: var(--accent-soft); }
  .save.is-error { color: var(--red); border-color: var(--red); }

  .status { padding: 40px 0; text-align: center; color: var(--text-muted); }
  .status.is-error { color: var(--amber); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-view="news">
  <header>
    <h1>Headlines</h1>
    <div class="pulled" id="pulled"></div>
  </header>
  <nav id="jump"></nav>
  <main id="groups"><div class="status">Loading…</div></main>
  <script src="assets/read.js"></script>
</body>
</html>
