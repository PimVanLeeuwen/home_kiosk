# Home hub stack: deploy to /volume1/docker/home_kiosk/ on the NAS.
#
# Follows the nas-docker conventions: restart: unless-stopped, TZ=Europe/Amsterdam.
# Disk SMART data comes from the existing Scrutiny container on :8080, so no
# smartctl_exporter here.
#
# Both images are built and pushed by GitHub Actions. Watchtower picks up new
# tags automatically, so a push to main eventually becomes a running container
# with no manual step.

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    # Host namespaces are required for real CPU, memory, uptime and network
    # figures — in a bridge network it would report the container's own stats.
    pid: host
    network_mode: host
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave

  collector:
    image: pimvanleeuwen/home-kiosk-collector:latest
    container_name: home-kiosk-collector
    restart: unless-stopped
    # Secrets referenced as ${VAR} in config.yaml: READECK_TOKEN now, plus
    # GHOSTFOLIO_TOKEN and TWELVEDATA_API_KEY for M3/M4. See .env.example.
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=Europe/Amsterdam
      # node-exporter and scrutiny both listen on the host, not on this network.
      - NAS_HOST=host.docker.internal
      # Readeck is on this network, so reach it by service name and internal
      # port rather than back out through the published one.
      - READECK_URL=http://readeck:8000
      - GHOSTFOLIO_URL=http://ghostfolio:3333
    ports:
      - 8000:8000
    volumes:
      # SQLite: daily storage samples and the payload cache must outlive the
      # container, or the storage projection restarts from zero on every update.
      - /volume1/docker/home_kiosk/data:/app/data
      # Container counts.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The backup marker written by rclone's backup.sh. Without this mount the
      # backup tile silently reads "unknown".
      - /volume1/docker/rclone/config:/volume1/docker/rclone/config:ro
      # tailscaled's control socket, shared by the tailscale stack. The hub
      # reads the NAS's tailnet name and IP from it for service links.
      - /volume1/docker/tailscale/run:/var/run/tailscale:ro
      # The nightly GitHub mirror (bare git repos), on /volume3 so the 03:00
      # rclone run takes it to Hetzner. Docker creates the folder on the first
      # deploy; without this mount the Backups page shows the mirror as failed.
      - /volume3/backups/github:/backups/github
      # The nightly database dumps' run records, written by nas-docker's
      # host-jobs/dump-databases.sh (root's crontab). Read-only: root writes
      # there, so no container may.
      - /volume3/backups/databases:/backups/databases:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - node-exporter
      - readeck
      - ghostfolio

  # --- Ghostfolio (M3) -----------------------------------------------------
  # Portfolio source. Holdings are entered in its own UI or imported from a
  # broker CSV; this project only ever reads.

  ghostfolio-db:
    image: postgres:16-alpine
    container_name: ghostfolio-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ghostfolio
      - POSTGRES_USER=ghostfolio
      - POSTGRES_PASSWORD=${GHOSTFOLIO_DB_PASSWORD}
    volumes:
      - /volume1/docker/ghostfolio/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostfolio"]
      interval: 10s
      retries: 10

  ghostfolio-redis:
    image: redis:alpine
    container_name: ghostfolio-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${GHOSTFOLIO_REDIS_PASSWORD}"]

  ghostfolio:
    image: ghostfolio/ghostfolio:latest
    container_name: ghostfolio
    restart: unless-stopped
    environment:
      # sslmode=disable, not prefer: Ghostfolio's Prisma adapter fails TLS
      # negotiation against this postgres image and the seed step dies.
      - DATABASE_URL=postgresql://ghostfolio:${GHOSTFOLIO_DB_PASSWORD}@ghostfolio-db:5432/ghostfolio?connect_timeout=300&sslmode=disable
      - REDIS_HOST=ghostfolio-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${GHOSTFOLIO_REDIS_PASSWORD}
      - ACCESS_TOKEN_SALT=${GHOSTFOLIO_ACCESS_TOKEN_SALT}
      - JWT_SECRET_KEY=${GHOSTFOLIO_JWT_SECRET}
      # NOTE: BASE_CURRENCY was removed from Ghostfolio (a documented breaking
      # change) and setting it here does nothing. Base currency is now a
      # per-user setting under Settings -> Base Currency in the web UI.
      - NODE_ENV=production
      - TZ=Europe/Amsterdam
    ports:
      - 3333:3333
    depends_on:
      ghostfolio-db:
        condition: service_healthy
      ghostfolio-redis:
        condition: service_started

  # Read-later target for tap-to-save on the news view. Readeck does its own
  # article extraction, so the collector only forwards the URL.
  readeck:
    image: codeberg.org/readeck/readeck:latest
    container_name: readeck
    restart: unless-stopped
    environment:
      - TZ=Europe/Amsterdam
      - READECK_SERVER_HOST=0.0.0.0
      - READECK_SERVER_PORT=8000
    ports:
      # Readeck listens on 8000 internally, which the collector already
      # publishes on the host, so it is mapped to 8084.
      - 8084:8000
    volumes:
      - /volume1/docker/readeck/data:/readeck

  dashboard:
    image: pimvanleeuwen/home-kiosk-dashboard:latest
    container_name: home-kiosk-dashboard
    restart: unless-stopped
    environment:
      - TZ=Europe/Amsterdam
    ports:
      # 8080 is Scrutiny; this is the port the Pi kiosk points at.
      - 8083:8083
    depends_on:
      - collector
