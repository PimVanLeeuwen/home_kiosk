# Desk dashboard stack — deploy to /volume1/docker/home_kiosk/ on the NAS.
#
# Follows the nas-docker conventions: restart: unless-stopped, TZ=Europe/Amsterdam.
# Disk SMART data comes from the existing Scrutiny container on :8080, so no
# smartctl_exporter here.
#
# The collector image is built and pushed by GitHub Actions, the same pattern as
# stock-bot. Watchtower picks up new tags automatically, so a push to main
# eventually becomes a running container with no manual step.

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    # Host namespaces are required for real CPU, memory, uptime and network
    # figures — in a bridge network it would report the container's own stats.
    pid: host
    network_mode: host
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave

  collector:
    image: pimvanleeuwen/home-kiosk-collector:latest
    container_name: home-kiosk-collector
    restart: unless-stopped
    environment:
      - TZ=Europe/Amsterdam
      # node-exporter and scrutiny both listen on the host, not on this network.
      - NAS_HOST=host.docker.internal
    ports:
      - 8000:8000
    volumes:
      # SQLite: daily storage samples and the payload cache must outlive the
      # container, or the storage projection restarts from zero on every update.
      - /volume1/docker/home_kiosk/data:/app/data
      # Container counts.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The backup marker written by rclone's backup.sh. Without this mount the
      # backup tile silently reads "unknown".
      - /volume1/docker/rclone/config:/volume1/docker/rclone/config:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - node-exporter

  # Read-later target for tap-to-save on the news view. Readeck does its own
  # article extraction, so the collector only forwards the URL.
  readeck:
    image: codeberg.org/readeck/readeck:latest
    container_name: readeck
    restart: unless-stopped
    environment:
      - TZ=Europe/Amsterdam
      - READECK_SERVER_HOST=0.0.0.0
      - READECK_SERVER_PORT=8000
    ports:
      # Readeck listens on 8000 internally, which the collector already
      # publishes on the host, so it is mapped to 8084.
      - 8084:8000
    volumes:
      - /volume1/docker/readeck/data:/readeck

  dashboard:
    image: pimvanleeuwen/home-kiosk-dashboard:latest
    container_name: home-kiosk-dashboard
    restart: unless-stopped
    environment:
      - TZ=Europe/Amsterdam
    ports:
      # 8080 is Scrutiny; this is the port the Pi kiosk points at.
      - 8083:8083
    depends_on:
      - collector
