[project]
name = "desk-dashboard-collector"
version = "0.1.0"
description = "Collects portfolio, price, feed and NAS data for the desk dashboard"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.sources"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
