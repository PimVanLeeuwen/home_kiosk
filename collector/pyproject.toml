[project]
name = "desk-dashboard-collector"
version = "0.1.0"
description = "Collects portfolio, price, feed and NAS data for the desk dashboard"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
    "httpx>=0.28",
    "apscheduler>=3.11,<4",
    "feedparser>=6.0.14",
    "trafilatura>=2.2",
    # Today's calendar: parsing iCalendar and unfolding repeating events.
    "icalendar>=7.3",
    "recurring-ical-events>=3.8.2",
    # Headline images: resized to small WebP files once, for the hub and the panels.
    "pillow>=12.3",
    # Apple TVs and HomePods: what plays, and unicast DNS-SD (pyatv.core.mdns, internal,
    # so pinned to the minor version).
    "pyatv>=0.18,<0.19",
]

[project.optional-dependencies]
dev = ["ruff>=0.16", "pytest>=9.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.alerts", "app.news", "app.portfolio", "app.sources", "app.sources.widgets"]

[tool.setuptools.package-data]
# Signify's root certificates for the Hue Bridge (app/sources/hue.py).
"app.sources" = ["*.pem"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
