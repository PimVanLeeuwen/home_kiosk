[project]
name = "desk-dashboard-collector"
version = "0.1.0"
description = "Collects portfolio, price, feed and NAS data for the desk dashboard"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
    "httpx>=0.28",
    "apscheduler>=3.11,<4",
    "feedparser>=6.0.14",
    "trafilatura>=2.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.16", "pytest>=9.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.alerts", "app.news", "app.portfolio", "app.sources", "app.sources.widgets"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
